user  nginx;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  #gzip  on;

  upstream api {
    server ${API_HOST}:${API_PORT};
  }

  server {
    listen 4200;

    # TLS is terminated upstream (Railway's edge, or any reverse proxy in front
    # of this container), so nginx believes it is serving plain http on 4200 and
    # builds absolute redirects to match: `http://host:4200/...`. From a browser
    # on an https:// page that is both mixed content and a port nothing exposes,
    # so the request is blocked rather than followed. Relative redirects carry no
    # scheme or port, so the browser resolves them against the real origin.
    absolute_redirect off;
    port_in_redirect off;

    # Hashed build assets. A name from a PREVIOUS build no longer exists, and
    # without this block those requests fall into `location /` below, where
    # try_files answers with index.html and a 200 — the browser asks for
    # JavaScript, receives HTML, and the page renders blank with nothing in the
    # network tab looking like a failure. 404 is the honest answer.
    location ~* \.(?:js|mjs|css|map|json|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
      root /srv/gauzy;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }

    location / {
      root /srv/gauzy;
      try_files $uri $uri/ /index.html;
      # index.html is the only file naming the current chunks, so a cached copy
      # sends the browser after files the last deploy deleted. Never cache it.
      add_header Cache-Control "no-store, must-revalidate" always;
    }

    # The dashboard probes exactly `/api`, with no trailing slash, on every boot
    # (ServerConnectionService.checkServerConnection builds `${API_BASE_URL}/api`)
    # and routes to `server-down` — the "Maintenance" page — when that request
    # fails with status 0. `location /api/` does not match a bare `/api`, so
    # without this block nginx answers with an auto_redirect to `/api/` and the
    # probe spends a round trip on a redirect it may not be able to follow.
    # An exact-match location is cheaper and cannot be redirected at all.
    location = /api {
      proxy_pass http://api;
      proxy_set_header Host $http_host;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $http_host;
    }

    # Uploaded files — screenshots above all — are served by the API from
    # assetPublicPath, not from this bundle. Upstream ships only the /api/ block,
    # which is fine when the dashboard and API sit on separate origins and the
    # browser addresses the API directly. Behind a single origin it is not: the
    # `location /` above swallows these requests and try_files answers with
    # index.html and a 200, so every screenshot renders broken while nothing
    # appears to fail. Content-Type text/html on a .png request is the tell.
    # ^~ so this prefix beats the regex asset block above: screenshot URLs end
    # in .png and would otherwise be matched there and served from disk.
    location ^~ /public/ {
      proxy_pass http://api;
      proxy_set_header Host $http_host;
    }
  }
}
