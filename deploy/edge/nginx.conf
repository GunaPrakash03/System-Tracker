# Single endpoint in front of the from-source stack.
#
# The containerised path (deploy/docker-compose.yml) builds its own images and
# proxies inside a compose network. This one puts the same single-origin shape
# in front of the stack `gauzy-stack` already runs on the host — the API from
# source on :3000 and the static dist — so there is one URL today without a
# twelve-gigabyte rebuild.

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;

	# The staged dist is served from disk; the API is a host process. This
	# container runs with network_mode: host, so 127.0.0.1 here is the host's
	# loopback and reaches an API bound to localhost only.
	upstream api {
		server 127.0.0.1:3000;
	}

	server {
		listen 8080;

		location / {
			root /srv/gauzy;
			try_files $uri $uri/ /index.html;
		}

		# Uploaded files — screenshots above all — are served by the API from
		# assetPublicPath, NOT from the dashboard bundle. Without this block the
		# `location /` above catches them and try_files hands back index.html
		# with a 200, so every screenshot silently renders as a broken image
		# while the network tab shows nothing failing. Content-Type text/html on
		# a .png request is the tell.
		location /public/ {
			proxy_pass http://api;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/ {
			proxy_pass http://api;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Screenshot uploads are multi-megabyte; the 1m default rejects them
			# with a 413 that reads like an auth failure in the agent's log.
			client_max_body_size 50m;
			proxy_read_timeout 300s;
		}
	}
}
