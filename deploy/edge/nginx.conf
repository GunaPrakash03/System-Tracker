# Single endpoint in front of the from-source stack.
#
# The containerised path (deploy/docker-compose.yml) builds its own images and
# proxies inside a compose network. This one puts the same single-origin shape
# in front of the stack `gauzy-stack` already runs on the host — the API from
# source on :3000 and the static dist — so there is one URL today without a
# twelve-gigabyte rebuild.

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;

	# The staged dist is served from disk; the API is a host process. This
	# container runs with network_mode: host, so 127.0.0.1 here is the host's
	# loopback and reaches an API bound to localhost only.
	upstream api {
		server 127.0.0.1:3000;
	}

	server {
		listen 8080;

		# Static assets are content-hashed by the Angular build, so a name is
		# immutable — but a name from a PREVIOUS build no longer exists. Without
		# this block those requests fall into `location /` below, where try_files
		# answers with index.html and a 200: the browser asks for JavaScript and
		# is handed HTML, the script fails to parse, and the page renders blank
		# with nothing in the network tab looking like a failure. A 404 is the
		# honest answer and lets Angular report a chunk-load error instead.
		location ~* \.(?:js|mjs|css|map|json|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
			root /srv/gauzy;
			try_files $uri =404;
			# Immutable because the hash changes whenever the content does.
			expires 1y;
			add_header Cache-Control "public, immutable" always;
		}

		location / {
			root /srv/gauzy;
			try_files $uri $uri/ /index.html;
			# index.html must NEVER be cached: it is the only file naming the
			# current chunks, so a stale copy sends the browser hunting for files
			# that were deleted by the last deploy.
			add_header Cache-Control "no-store, must-revalidate" always;
		}

		# Uploaded files — screenshots above all — are served by the API from
		# assetPublicPath, NOT from the dashboard bundle. Without this block the
		# `location /` above catches them and try_files hands back index.html
		# with a 200, so every screenshot silently renders as a broken image
		# while the network tab shows nothing failing. Content-Type text/html on
		# a .png request is the tell.
		# ^~ so this prefix beats the regex asset block above: screenshot URLs end
		# in .png and would otherwise be matched there and served from disk, where
		# they do not exist. Regex locations normally win over prefix ones.
		location ^~ /public/ {
			proxy_pass http://api;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/ {
			proxy_pass http://api;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Screenshot uploads are multi-megabyte; the 1m default rejects them
			# with a 413 that reads like an auth failure in the agent's log.
			client_max_body_size 50m;
			proxy_read_timeout 300s;
		}
	}
}
